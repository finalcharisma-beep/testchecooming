<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Lotto Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="theme-toggle">
                <button id="theme-btn" aria-label="Toggle Theme">
                    <span class="icon">🌙</span>
                </button>
            </div>
            <h1>Lotto Number Generator</h1>
            <p>오늘의 행운을 확인해보세요</p>
        </header>
        
        <main>
            <div id="lotto-display" class="lotto-numbers">
                <div class="ball placeholder">?</div>
                <div class="ball placeholder">?</div>
                <div class="ball placeholder">?</div>
                <div class="ball placeholder">?</div>
                <div class="ball placeholder">?</div>
                <div class="ball placeholder">?</div>
            </div>
            
            <button id="generate-btn" class="generate-btn">번호 생성하기</button>
        </main>
        
        <section class="contact-section">
            <hr>
            <h3>제휴 및 서비스 문의</h3>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
                <div class="form-group">
                    <input type="email" name="email" placeholder="이메일 주소를 입력하세요" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="문의 내용을 입력하세요" required></textarea>
                </div>
                <button type="submit" class="submit-btn">문의하기</button>
            </form>
        </section>
        
        <footer>
            <p>© 2026 Luck Generator</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
